<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog | Sarthak Chaturvedi</title>
    <meta name="description" content="Thoughts on risk, technology, energy, and career - writings by Sarthak Chaturvedi.">
    <link rel="canonical" href="https://sarthakchat.github.io/blog.html">

    <!-- Open Graph / LinkedIn -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sarthakchat.github.io/blog.html">
    <meta property="og:title" content="Blog | Sarthak Chaturvedi">
    <meta property="og:description" content="Thoughts on risk, technology, energy, and career.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="152x152" href="assets/img/home.png">
    <link rel="shortcut icon" href="assets/img/home.png">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-YTFCT9JKWV"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}

    <style>
        :root {
            --navy: #0a2240;
            --gold: #b8860b;
            --gold-light: #d4a84b;
            --text: #1a1a1a;
            --text-secondary: #4a5568;
            --border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 16px;
            line-height: 1.7;
            color: var(--text);
            background: #ffffff;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
        }

        /* Header */
        header {
            background: var(--navy);
            padding: 16px 0;
            border-bottom: 3px solid var(--gold);
        }

        .header-inner {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .site-title {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 22px;
            font-weight: 600;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: 0.02em;
        }

        nav {
            display: flex;
            gap: 32px;
        }

        nav a {
            font-size: 13px;
            font-weight: 500;
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: var(--gold-light);
        }

        /* Main Content */
        main {
            max-width: 1000px;
            margin: 0 auto;
            padding: 72px 32px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 48px;
        }

        .page-title {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 36px;
            font-weight: 600;
            color: var(--navy);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .page-title::after {
            content: '';
            width: 120px;
            height: 1px;
            background: linear-gradient(to right, var(--gold), transparent);
        }

        .subscribe-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--gold);
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .subscribe-btn:hover {
            background: var(--gold-light);
            transform: translateY(-1px);
        }

        /* Blog Posts */
        .posts {
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .post {
            padding: 24px;
            background: linear-gradient(to bottom right, #f8f9fa, #ffffff);
            border-left: 3px solid transparent;
            transition: all 0.2s ease;
        }

        .post:hover {
            border-left-color: var(--gold);
            transform: translateX(4px);
        }

        .post-date {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 8px;
        }

        .post-title {
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-size: 22px;
            font-weight: 600;
            color: var(--navy);
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .post-title a {
            color: inherit;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .post-title a:hover {
            color: var(--gold);
        }

        .post-description {
            font-size: 16px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* Footer */
        footer {
            background: var(--navy);
            padding: 48px 0;
            margin-top: 72px;
            border-top: 3px solid var(--gold);
        }

        .footer-inner {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-info {
            color: var(--gold-light);
            font-size: 14px;
        }

        .footer-info strong {
            font-family: 'Cormorant Garamond', Georgia, serif;
            color: var(--gold-light);
            font-size: 18px;
            font-weight: 600;
        }

        .footer-links {
            display: flex;
            gap: 24px;
        }

        .footer-links a {
            font-size: 13px;
            font-weight: 500;
            color: var(--gold-light);
            text-decoration: none;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            transition: color 0.2s ease;
        }

        .footer-links a:hover {
            color: #ffffff;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-inner {
                flex-direction: column;
                gap: 16px;
                text-align: center;
            }

            nav {
                gap: 20px;
            }

            main {
                padding: 48px 24px;
            }

            .page-header {
                flex-direction: column;
                gap: 24px;
                align-items: flex-start;
            }

            .page-title {
                font-size: 28px;
            }

            .footer-inner {
                flex-direction: column;
                gap: 24px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-inner">
            <a href="index.html" class="site-title">Sarthak Chaturvedi</a>
            <nav>
                <a href="index.html">Biography</a>
                <a href="publications.html">Publications</a>
                <a href="activity.html">Activity</a>
                <a href="blog.html">Blog</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <div class="page-header">
            <h1 class="page-title">Blog</h1>
            <a href="https://sarthakchaturvedi.substack.com/" class="subscribe-btn" target="_blank">Subscribe on Substack</a>
        </div>

        <div class="posts">
            <article class="post">
                <div class="post-date">October 2025</div>
                <h2 class="post-title">
                    <a href="https://sarthakchaturvedi.substack.com/p/asymmetric-bets-are-all-you-need" target="_blank">Asymmetric Bets Are All You Need?</a>
                </h2>
                <p class="post-description">A year in Seattle on risk, compounding upside, and fewer what-ifs.</p>
            </article>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-inner">
            <div class="footer-info">
                <strong>Pacific Northwest National Laboratory</strong>
            </div>
            <div class="footer-links">
                <a href="https://www.linkedin.com/in/sarthak-chaturvedi/">LinkedIn</a>
                <a href="contact.html">Contact</a>
            </div>
        </div>
    </footer>
</body>
</html>
